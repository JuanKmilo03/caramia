services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: caramia_redis
    ports:
      - "6379:6379"
    restart: always

  odoo:
    build: .
    image: caramia-odoo:18.0
    command: odoo -c /etc/odoo/odoo.conf --dev=xml
    depends_on:
      - db
    environment:
      - AGENT_SECRET=${AGENT_SECRET}
      - FASTAPI_URL=http://fastapi_ai:8000
    ports:
      - "8090:8069"
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - ./custom_addons:/mnt/extra-addons
      - odoo-web-data:/var/lib/odoo

  fastapi_ai:
    build: ./fastapi_service
    env_file:
      - .env
    ports:
      - "8095:8000"
    depends_on:
      - odoo
      - redis
    environment:
      - REDIS_HOST=redis

volumes:
  odoo-db-data:
  odoo-web-data: